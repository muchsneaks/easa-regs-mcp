name: Update EASA index

# Weekly: download the current EASA Easy Access Rules, rebuild the index, run the full test suite
# (incl. golden queries on real data) and publish a release when any book changed.
on:
  push:
    branches: [main]
    paths:
      - "src/easa_regs/sources.py"
      - "src/easa_regs/parse.py"
      - ".github/workflows/update-index.yml"
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Publish a release even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Fetch EASA XML packages
        run: easa-regs-fetch

      - name: Build index
        run: |
          easa-regs-build --keep-going
          if [ -f data/build_errors.txt ]; then while read -r l; do echo "::warning::$l"; done < data/build_errors.txt; fi

      - name: Full test suite on real data
        run: |
          set -o pipefail
          pytest -q -rf --tb=line 2>&1 | tee pytest.log || {
            grep -E "^(FAILED|ERROR)|Error|assert" pytest.log | head -20 | while read -r l; do echo "::error::$l"; done
            exit 1; }

      - name: Compare with latest release
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          gh release download --pattern manifest.json --dir prev 2>/dev/null || echo "{}" > prev/manifest.json
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, pathlib
          new = json.loads(pathlib.Path("data/manifest.json").read_text())
          p = pathlib.Path("prev/manifest.json")
          old = json.loads(p.read_text()) if p.exists() else {}
          lines = []
          for code, b in sorted(new.items()):
              o = old.get(code)
              if not o:
                  lines.append(f"- **{code}** added: published {b['pub_time'][:10]}, {b['n_rules']} rules")
              elif o["pub_time"] != b["pub_time"] or o["n_rules"] != b["n_rules"]:
                  lines.append(f"- **{code}** updated: {o['pub_time'][:10]} -> {b['pub_time'][:10]}, "
                               f"{o['n_rules']} -> {b['n_rules']} rules")
          err = pathlib.Path("data/build_errors.txt")
          if err.exists():
              lines.append("\n## Books that failed to parse (kept out of this index)\n" + err.read_text())
          pathlib.Path("notes.md").write_text(
              ("## Changes\n" + "\n".join(lines) if lines else "No EASA changes.") +
              "\n\n## Books\n" + "\n".join(f"- {c}: {b['title']} (published {b['pub_time'][:10]}, {b['n_rules']} rules)"
                                          for c, b in sorted(new.items())))
          print(f"changed={'true' if lines else 'false'}")
          EOF

      - name: Publish release
        # new EASA data, or parser/sources changed (push), or manual force
        if: steps.diff.outputs.changed == 'true' || github.event_name == 'push' || inputs.force
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="index-$(date -u +%Y-%m-%d-%H%M)"
          gh release create "$TAG" data/easa_regs.sqlite data/manifest.json \
            --title "EASA index $(date -u +%Y-%m-%d)" --notes-file notes.md --latest
